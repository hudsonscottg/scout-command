<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScoutCommand - Mobile Scouter Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes flyToTent {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      50% { transform: translateY(-70px) scale(0.6) rotate(-6deg); opacity: 0.8; }
      100% { transform: translateY(-140px) scale(0.1) rotate(12deg); opacity: 0; }
    }
    .animate-fly {
      animation: flyToTent 0.45s ease-in-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24">

  <div id="root">
    <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 text-sm font-mono space-y-3">
      <div class="text-3xl animate-bounce">⚜️</div>
      <div>Loading ScoutCommand...</div>
    </div>
  </div>

  <script>
    // Fallback error catcher if CDNs lag or fail
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root');
      if (root && root.innerHTML.includes('Loading')) {
        root.innerHTML = '<div style="color: #f87171; padding: 30px; text-align: center; font-family: sans-serif; font-size: 14px;"><b>App Loading Notice</b><br/><br/>Network script delayed. Please refresh the page.</div>';
      }
    });
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ScoutCommandApp() {
      const [activeTab, setActiveTab] = useState('attendance');

      const [flags, setFlags] = useState({
        autoProcurement: true,
        youthVote: true,
        weatherPivot: true,
        betaSync: false
      });

      // 1. ATTENDANCE STATE (Sorted by Typical Arrival Sequence)
      const [cubRoster, setCubRoster] = useState([
        { id: 1, name: 'Benjamin H.', arrivalRank: 1, status: 'absent' },
        { id: 2, name: 'Brookie H.', arrivalRank: 2, status: 'absent' },
        { id: 3, name: 'Owen H.', arrivalRank: 3, status: 'absent' },
        { id: 4, name: 'Rory M.', arrivalRank: 4, status: 'absent' },
        { id: 5, name: 'Logan K.', arrivalRank: 5, status: 'absent' },
        { id: 6, name: 'Liam P.', arrivalRank: 6, status: 'absent' },
        { id: 7, name: 'Charlotte S.', arrivalRank: 7, status: 'absent' },
        { id: 8, name: 'Noah T.', arrivalRank: 8, status: 'absent' },
        { id: 9, name: 'Mason R.', arrivalRank: 9, status: 'absent' },
        { id: 10, name: 'Ava W.', arrivalRank: 10, status: 'absent' }
      ]);
      const [animatingId, setAnimatingId] = useState(null);
      const [attendanceHistory, setAttendanceHistory] = useState([]);

      const handleCheckIn = (id) => {
        setAnimatingId(id);
        setTimeout(() => {
          setCubRoster(prev => prev.map(c => c.id === id ? { ...c, status: 'present' } : c));
          setAttendanceHistory(prev => [...prev, id]);
          setAnimatingId(null);
        }, 400);
      };

      const handleUndoAttendance = () => {
        if (attendanceHistory.length === 0) return;
        const lastId = attendanceHistory[attendanceHistory.length - 1];
        setCubRoster(prev => prev.map(c => c.id === lastId ? { ...c, status: 'absent' } : c));
        setAttendanceHistory(prev => prev.slice(0, -1));
      };

      // 2. PLANNER & MEETINGS STATE
      const [selectedMeetingId, setSelectedMeetingId] = useState(null);
      const [meetings, setMeetings] = useState([
        {
          id: 1,
          date: 'Oct 13, 2026',
          title: 'Paracord & Compass Navigation',
          theme: 'Trail Skills OAS Stage 2',
          actionRequired: true,
          actionNotice: 'Need Scouter to purchase buckles & prep paracord',
          scouterCoverageCount: 3,
          stations: [
            { id: 's1', name: 'Station A: Compass Bearings', assignedTo: 'Baloo' },
            { id: 's2', name: 'Station B: Paracord Weaving', assignedTo: 'Unassigned' },
            { id: 's3', name: 'Gathering Game: Knot Relay', assignedTo: 'Kaa' }
          ],
          actionItems: [
            { id: 'a1', task: 'Pick up propane tanks', assignedTo: 'Parent Volunteer' },
            { id: 'a2', task: 'Buy 100ft paracord from Amazon', assignedTo: 'Unassigned' }
          ]
        },
        {
          id: 2,
          date: 'Oct 20, 2026',
          title: 'Campfire Safety & Edible Fires',
          theme: 'Bushcraft OAS Stage 1',
          actionRequired: false,
          actionNotice: 'All supplies & station leads confirmed',
          scouterCoverageCount: 4,
          stations: [
            { id: 's4', name: 'Station A: Pretzel Fire Building', assignedTo: 'Bagheera' },
            { id: 's5', name: 'Station B: Spark Lighting Safety', assignedTo: 'Akela' }
          ],
          actionItems: [
            { id: 'a3', task: 'Bring pretzel sticks & marshmallows', assignedTo: 'Akela' }
          ]
        }
      ]);

      const handleAssignStation = (meetingId, stationId, scouterName) => {
        setMeetings(prev => prev.map(m => {
          if (m.id !== meetingId) return m;
          return {
            ...m,
            stations: m.stations.map(st => st.id === stationId ? { ...st, assignedTo: scouterName } : st)
          };
        }));
      };

      const handleClaimTask = (meetingId, taskId, scouterName) => {
        setMeetings(prev => prev.map(m => {
          if (m.id !== meetingId) return m;
          return {
            ...m,
            actionItems: m.actionItems.map(a => a.id === taskId ? { ...a, assignedTo: scouterName } : a)
          };
        }));
      };

      // 3. BADGES & ADMIN FILTER STATE
      const [scouterAdminMode, setScouterAdminMode] = useState(false);
      const [allBadges, setAllBadges] = useState([
        { id: 'b1', name: 'Camping OAS', category: 'Outdoor Adventure', votes: 15, enabled: true },
        { id: 'b2', name: 'Trail Skills OAS', category: 'Outdoor Adventure', votes: 12, enabled: true },
        { id: 'b3', name: 'Emergency Skills OAS', category: 'Outdoor Adventure', votes: 9, enabled: true },
        { id: 'b4', name: 'Aquatics OAS', category: 'Outdoor Adventure', votes: 6, enabled: true },
        { id: 'b5', name: 'Winter Skills OAS', category: 'Outdoor Adventure', votes: 4, enabled: false },
        { id: 'b6', name: 'Space Explorer', category: 'Personal Achievement', votes: 11, enabled: true },
        { id: 'b7', name: 'Wilderness Chef', category: 'Personal Achievement', votes: 14, enabled: true },
        { id: 'b8', name: 'Builder & Carpenter', category: 'Personal Achievement', votes: 8, enabled: true }
      ]);

      const toggleBadgeEnabled = (id) => {
        setAllBadges(prev => prev.map(b => b.id === id ? { ...b, enabled: !b.enabled } : b));
      };

      const handleYouthVote = (id) => {
        setAllBadges(prev => prev.map(b => b.id === id ? { ...b, votes: b.votes + 1 } : b));
      };

      // 4. PARENT LOGISTICS SURVEY STATE
      const [parentSurvey, setParentSurvey] = useState({
        maxDriveMinutes: 60,
        canCarpool: 'Yes, 3 extra seats',
        volunteeredTasks: []
      });

      const parentTaskOptions = [
        '🔥 Fill Propane Tanks for Camp',
        '🛒 Pick up Meeting Craft Supplies',
        '🍕 Assist with Meeting Snack Prep',
        '🧹 Stay 15 mins for Hall Cleanup'
      ];

      const toggleParentTask = (task) => {
        setParentSurvey(prev => {
          const exists = prev.volunteeredTasks.includes(task);
          return {
            ...prev,
            volunteeredTasks: exists 
              ? prev.volunteeredTasks.filter(t => t !== task)
              : [...prev.volunteeredTasks, task]
          };
        });
      };

      // 5. HELP MODAL STATE
      const [helpModalOpen, setHelpModalOpen] = useState(false);
      const [helpSentMessage, setHelpSentMessage] = useState(null);

      const triggerHelpAlert = (level) => {
        setHelpSentMessage(level === 'urgent' ? '🚨 URGENT ALERT: Leaders notified to come immediately!' : '🙋 ROUTINE ALERT: Leaders notified to drop by when free.');
        setTimeout(() => {
          setHelpModalOpen(false);
          setHelpSentMessage(null);
        }, 2000);
      };

      const absentCubs = cubRoster.filter(c => c.status === 'absent').sort((a,b) => a.arrivalRank - b.arrivalRank);
      const presentCubs = cubRoster.filter(c => c.status === 'present');

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-900 shadow-2xl relative flex flex-col">
          
          {/* Header Bar */}
          <header className="bg-emerald-950 border-b border-emerald-800 p-4 sticky top-0 z-30 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <span className="text-2xl">⚜️</span>
              <div>
                <h1 className="font-bold text-amber-400 text-lg leading-tight">ScoutCommand</h1>
                <p className="text-xs text-emerald-300">1st Elmira Cub Pack</p>
              </div>
            </div>
            <span className="bg-emerald-900 text-emerald-200 text-xs px-2.5 py-1 rounded-full border border-emerald-700 font-mono">
              2026–2027
            </span>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 p-4 space-y-4 overflow-y-auto no-scrollbar">

            {/* TAB 1: ATTENDANCE */}
            {activeTab === 'attendance' && (
              <div className="space-y-4">
                
                <div className="bg-emerald-950 border-2 border-emerald-600 rounded-2xl p-4 text-center relative overflow-hidden shadow-xl">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-xs font-mono text-emerald-400">CHECK-IN STATION</span>
                    <button 
                      onClick={handleUndoAttendance}
                      disabled={attendanceHistory.length === 0}
                      className={`text-xs px-2.5 py-1 rounded-lg border font-bold flex items-center gap-1 ${attendanceHistory.length > 0 ? 'bg-amber-500 text-slate-950 border-amber-400 shadow' : 'bg-slate-800 text-slate-600 border-slate-700 cursor-not-allowed'}`}
                    >
                      ↩️ Undo Last
                    </button>
                  </div>

                  <div className="text-5xl my-2">🏕️</div>
                  <h3 className="font-bold text-amber-400 text-base">Present in the Tent ({presentCubs.length} / {cubRoster.length})</h3>

                  <div className="flex flex-wrap justify-center gap-1.5 mt-3 max-h-28 overflow-y-auto no-scrollbar">
                    {presentCubs.length === 0 ? (
                      <span className="text-xs text-emerald-500 italic">No Cubs checked in yet...</span>
                    ) : (
                      presentCubs.map(c => (
                        <span key={c.id} className="bg-emerald-800 border border-emerald-600 text-emerald-100 text-xs px-2.5 py-1 rounded-full font-bold shadow-sm">
                          ✓ {c.name}
                        </span>
                      ))
                    )}
                  </div>
                </div>

                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Tap to Check In (Sorted by Typical Arrival)</h4>
                    <span className="text-[10px] text-slate-500 font-mono">{absentCubs.length} Remaining</span>
                  </div>

                  {absentCubs.length === 0 ? (
                    <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center text-emerald-400 font-bold text-sm">
                      🎉 All Cubs have arrived and are in the tent!
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {absentCubs.map((cub) => {
                        const isAnimating = animatingId === cub.id;
                        return (
                          <button
                            key={cub.id}
                            onClick={() => handleCheckIn(cub.id)}
                            className={`w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3.5 rounded-xl text-left flex items-center justify-between transition-all duration-300 shadow-sm ${isAnimating ? 'animate-fly border-emerald-400 bg-emerald-900/80' : ''}`}
                          >
                            <div className="flex items-center space-x-3">
                              <span className="w-6 h-6 rounded-full bg-slate-900 border border-slate-700 text-amber-400 font-mono text-xs flex items-center justify-center font-bold">
                                #{cub.arrivalRank}
                              </span>
                              <span className="font-bold text-slate-100 text-sm">{cub.name}</span>
                            </div>
                            <span className="text-xs bg-emerald-950 text-emerald-300 border border-emerald-800 px-3 py-1 rounded-lg font-bold">
                              Touch to Arrive ⛺
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* TAB 2: PLANNER */}
            {activeTab === 'planner' && (
              <div className="space-y-4">
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-slate-300 text-sm">Weekly Program Overview</h3>
                    <span className="text-xs text-emerald-400 font-mono">Tap Meeting for Signups</span>
                  </div>

                  {meetings.map((m) => (
                    <div key={m.id} className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-sm">
                      <div 
                        onClick={() => setSelectedMeetingId(selectedMeetingId === m.id ? null : m.id)}
                        className="p-4 cursor-pointer flex items-center justify-between hover:bg-slate-750 transition"
                      >
                        <div className="space-y-1">
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-mono text-amber-400 bg-amber-950 px-2 py-0.5 rounded border border-amber-800">
                              {m.date}
                            </span>
                            <span className="text-xs text-slate-400">({m.scouterCoverageCount} Scouters)</span>
                          </div>
                          <h4 className="font-bold text-slate-100 text-base">{m.title}</h4>
                          <p className="text-xs text-emerald-400">{m.theme}</p>
                        </div>

                        <div>
                          {m.actionRequired ? (
                            <span className="bg-rose-950 text-rose-300 border border-rose-800 text-xs px-2.5 py-1 rounded-full font-bold">
                              ⚠️ Action Needed
                            </span>
                          ) : (
                            <span className="bg-emerald-950 text-emerald-300 border border-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold">
                              ✓ Ready
                            </span>
                          )}
                        </div>
                      </div>

                      {selectedMeetingId === m.id && (
                        <div className="bg-slate-900 p-4 border-t border-slate-700 space-y-4 text-xs">
                          <div className={`p-2.5 rounded-lg border ${m.actionRequired ? 'bg-rose-950/60 border-rose-800 text-rose-200' : 'bg-emerald-950/60 border-emerald-800 text-emerald-200'}`}>
                            <strong>Status Note:</strong> {m.actionNotice}
                          </div>

                          <div className="space-y-2">
                            <h5 className="font-bold text-amber-400 text-xs uppercase tracking-wider">Station Assignments</h5>
                            {m.stations.map((st) => (
                              <div key={st.id} className="bg-slate-800 p-2.5 rounded-lg border border-slate-700 flex items-center justify-between">
                                <span className="font-bold text-slate-200">{st.name}</span>
                                <div className="flex items-center gap-2">
                                  <span className={`font-mono text-[11px] ${st.assignedTo === 'Unassigned' ? 'text-amber-400 font-bold' : 'text-emerald-300'}`}>
                                    {st.assignedTo}
                                  </span>
                                  {st.assignedTo === 'Unassigned' && (
                                    <button 
                                      onClick={() => handleAssignStation(m.id, st.id, 'Akela')}
                                      className="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded text-[10px] font-bold"
                                    >
                                      Sign Up
                                    </button>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>

                          <div className="space-y-2 pt-1">
                            <h5 className="font-bold text-amber-400 text-xs uppercase tracking-wider">Action Items</h5>
                            {m.actionItems.map((act) => (
                              <div key={act.id} className="bg-slate-800 p-2.5 rounded-lg border border-slate-700 flex items-center justify-between">
                                <span className="text-slate-300">{act.task}</span>
                                <div className="flex items-center gap-2">
                                  <span className={`font-mono text-[11px] ${act.assignedTo === 'Unassigned' ? 'text-rose-400 font-bold' : 'text-slate-400'}`}>
                                    {act.assignedTo}
                                  </span>
                                  {act.assignedTo === 'Unassigned' && (
                                    <button 
                                      onClick={() => handleClaimTask(m.id, act.id, 'Akela')}
                                      className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2 py-1 rounded text-[10px] font-bold"
                                    >
                                      Claim
                                    </button>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: LIVE */}
            {activeTab === 'live' && (
              <div className="space-y-4">
                <button 
                  onClick={() => setHelpModalOpen(true)}
                  className="w-full bg-slate-800 hover:bg-slate-750 border-2 border-amber-500 text-amber-400 font-bold py-3.5 rounded-xl shad
