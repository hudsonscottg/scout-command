<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScoutCommand</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        scoutGreen: '#1b4d3e', /* Scouting Dark Green */
                        scoutAmber: '#ffbf00', /* Scouting Amber */
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6; 
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom toggle switch transitions */
        .toggle-switch { transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); }
        .toggle-bg { transition: background-color 0.3s ease; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Sub-Component: Live Meeting
        function LiveMeeting() {
            const [timeLeft, setTimeLeft] = useState(90 * 60); // 90 minutes in seconds
            const [isRainPivot, setIsRainPivot] = useState(false);
            const [showModal, setShowModal] = useState(false);

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => (prev > 0 ? prev - 1 : 0));
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;

            const stations = [
                { name: "Opening", out: "Flagpole (Field)", in: "Main Hall (Circle)" },
                { name: "Knots", out: "Pine Trees (Lashings)", in: "Chairs (Practice)" },
                { name: "Craft", out: "Picnic Tables", in: "Gym Floor" },
                { name: "Closing", out: "Campfire Pit", in: "Main Hall" }
            ];

            return (
                <div class="h-full flex flex-col pb-24 overflow-y-auto pt-4 px-4 space-y-5">
                    {/* Master Timer & Pivot Toggle */}
                    <div className="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div>
                            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Time Remaining</div>
                            <div className="text-4xl font-mono font-black text-scoutGreen">
                                {mins}:{secs < 10 ? '0'+secs : secs}
                            </div>
                        </div>
                        <div className="flex flex-col items-end">
                            <span className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Rain Pivot</span>
                            <label className="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" className="sr-only" checked={isRainPivot} onChange={() => setIsRainPivot(!isRainPivot)} />
                                <div className={`w-14 h-7 rounded-full shadow-inner toggle-bg ${isRainPivot ? 'bg-blue-500' : 'bg-gray-300'}`}></div>
                                <div className={`absolute left-1 top-1 w-5 h-5 bg-white rounded-full shadow toggle-switch ${isRainPivot ? 'translate-x-7' : 'translate-x-0'}`}></div>
                            </label>
                        </div>
                    </div>

                    {/* Station Cards */}
                    <div className="space-y-3">
                        <h2 className="text-lg font-bold text-gray-700 pl-1">Meeting Plan</h2>
                        {stations.map((station, i) => (
                            <div key={i} className="bg-white p-4 rounded-xl border-l-4 border-scoutAmber shadow-sm flex items-center justify-between">
                                <div>
                                    <h3 className="font-bold text-xl text-scoutGreen">{station.name}</h3>
                                    <p className="text-sm text-gray-500 font-medium flex items-center mt-1">
                                        <svg className="w-4 h-4 mr-1 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        </svg>
                                        {isRainPivot ? station.in : station.out}
                                    </p>
                                </div>
                                <div className="text-scoutAmber font-bold text-lg opacity-50">0{i+1}</div>
                            </div>
                        ))}
                    </div>

                    {/* Call Scouter Button */}
                    <button onClick={() => setShowModal(true)} className="mt-4 w-full bg-red-600 active:bg-red-700 text-white font-black py-4 rounded-xl shadow-lg text-lg tracking-wider border-b-4 border-red-800 transition-all">
                        CALL SCOUTER
                    </button>

                    {/* Call Scouter Modal */}
                    {showModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-6 backdrop-blur-sm">
                            <div className="bg-red-600 p-8 rounded-3xl shadow-2xl text-center w-full max-w-sm border-4 border-red-400">
                                <svg className="w-20 h-20 mx-auto text-white mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                                </svg>
                                <h2 className="text-3xl font-black text-white mb-2 tracking-wide">HELP NEEDED</h2>
                                <p className="text-red-100 mb-8 font-medium text-lg">Alerting all available scouters to your station...</p>
                                <button onClick={() => setShowModal(false)} className="bg-white text-red-600 px-6 py-4 rounded-xl font-black w-full text-xl shadow-lg active:scale-95 transition-transform">
                                    CANCEL ALERT
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Sub-Component: Procurement
        function Procurement() {
            const [isApproved, setIsApproved] = useState(false);
            const orderTotal = 15.49;
            const totalBudget = 150.00;
            const currentSpent = 45.00;
            
            const newSpent = isApproved ? currentSpent + orderTotal : currentSpent;
            const remaining = totalBudget - newSpent;
            const spentPercent = (newSpent / totalBudget) * 100;

            return (
                <div className="h-full flex flex-col pb-24 overflow-y-auto pt-4 px-4 space-y-6">
                    <h2 className="text-2xl font-black text-scoutGreen">Procurement</h2>
                    
                    {/* Budget Bars */}
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div className="flex justify-between items-end mb-3">
                            <div>
                                <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider">Fall Term Budget</h3>
                                <div className="text-2xl font-black text-scoutGreen mt-1">${remaining.toFixed(2)} <span className="text-sm font-medium text-gray-400">left</span></div>
                            </div>
                            <div className="text-sm font-bold text-gray-500">
                                ${newSpent.toFixed(2)} spent
                            </div>
                        </div>
                        <div className="w-full bg-gray-100 rounded-full h-4 overflow-hidden shadow-inner">
                            <div className="bg-scoutGreen h-4 transition-all duration-700 ease-out rounded-full" style={{width: `${spentPercent}%`}}></div>
                        </div>
                    </div>

                    {/* Order Card */}
                    <div className="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-200">
                        <div className="bg-gray-50 px-5 py-4 border-b border-gray-200 flex justify-between items-center">
                            <div className="font-black text-gray-700">Oct 12 Meeting</div>
                            <div className="flex items-center text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
                                Amazon Prime
                            </div>
                        </div>
                        <div className="p-5">
                            <ul className="text-sm text-gray-600 space-y-3 mb-6">
                                <li className="flex justify-between"><span>Paracord 550lb (100ft)</span> <span className="font-medium">$9.99</span></li>
                                <li className="flex justify-between"><span>Crafting Glue (2x)</span> <span className="font-medium">$4.50</span></li>
                                <li className="flex justify-between text-gray-400"><span>Estimated Tax</span> <span>$1.00</span></li>
                            </ul>
                            
                            <div className="flex justify-between items-center font-black text-xl border-t border-dashed border-gray-300 pt-4 mb-6 text-scoutGreen">
                                <span>Order Total</span>
                                <span>${orderTotal.toFixed(2)}</span>
                            </div>
                            
                            {isApproved ? (
                                <div className="bg-scoutGreen text-white text-center py-4 rounded-xl font-bold flex justify-center items-center text-lg shadow-inner">
                                    <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                    Approved & Ordered
                                </div>
                            ) : (
                                <button onClick={() => setIsApproved(true)} className="w-full bg-scoutAmber text-scoutGreen font-black py-4 rounded-xl shadow-md hover:bg-yellow-400 active:bg-yellow-500 transition-colors text-lg border-b-4 border-yellow-500 active:border-b-0 active:translate-y-1">
                                    Approve & Order
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            )
        }

        // Sub-Component: Settings
        function Settings() {
            const [autoProc, setAutoProc] = useState(true);
            const [youthVote, setYouthVote] = useState(false);
            const [betaTimers, setBetaTimers] = useState(true);

            const Toggle = ({label, desc, state, setState}) => (
                <div className="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4 cursor-pointer" onClick={() => setState(!state)}>
                    <div className="pr-4">
                        <div className="font-bold text-gray-800 text-lg">{label}</div>
                        <div className="text-xs font-medium text-gray-400 mt-1">{desc}</div>
                    </div>
                    <label className="relative inline-flex items-center cursor-pointer pointer-events-none">
                        <input type="checkbox" className="sr-only" checked={state} readOnly />
                        <div className={`w-14 h-7 rounded-full shadow-inner toggle-bg ${state ? 'bg-scoutGreen' : 'bg-gray-200'}`}></div>
                        <div className={`absolute left-1 top-1 w-5 h-5 bg-white rounded-full shadow toggle-switch ${state ? 'translate-x-7' : 'translate-x-0'}`}></div>
                    </label>
                </div>
            );

            return (
                <div className="h-full flex flex-col pb-24 overflow-y-auto pt-4 px-4">
                    <h2 className="text-2xl font-black text-scoutGreen mb-6">System Settings</h2>
                    <div>
                        <Toggle label="Auto-Procurement" desc="Automatically approve orders under $20" state={autoProc} setState={setAutoProc} />
                        <Toggle label="Youth Vote" desc="Enable poll module in Youth app" state={youthVote} setState={setYouthVote} />
                        <Toggle label="Beta Timers" desc="Use experimental meeting countdown UI" state={betaTimers} setState={setBetaTimers} />
                    </div>
                    
                    <div className="mt-8 text-center text-xs text-gray-400 font-bold uppercase tracking-widest">
                        ScoutCommand v2.4.1
                    </div>
                </div>
            )
        }

        // Main App Component
        function App() {
            const [activeTab, setActiveTab] = useState('live');

            const navItems = [
                { id: 'planner', label: 'Planner', icon: 'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' },
                { id: 'live', label: 'Live Meeting', icon: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z' },
                { id: 'procurement', label: 'Procurement', icon: 'M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z' },
                { id: 'youth', label: 'Youth Vote', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' },
                { id: 'settings', label: 'Settings', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z' }
            ];

            return (
                <div className="flex flex-col h-screen bg-gray-50">
                    {/* Top Header */}
                    <header className="bg-scoutGreen text-white p-4 shadow-md z-10 flex-shrink-0 safe-top">
                        <div className="flex items-center justify-center">
                            <svg className="w-6 h-6 text-scoutAmber mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                            </svg>
                            <h1 className="text-xl font-black text-white tracking-widest uppercase">ScoutCommand</h1>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-grow overflow-hidden relative">
                        {activeTab === 'planner' && <div className="h-full flex items-center justify-center text-gray-400 font-bold p-8 text-center text-lg">Planner Tab<br/><span className="text-sm font-normal mt-2 block">Coming Soon</span></div>}
                        {activeTab === 'live' && <LiveMeeting />}
                        {activeTab === 'procurement' && <Procurement />}
                        {activeTab === 'youth' && <div className="h-full flex items-center justify-center text-gray-400 font-bold p-8 text-center text-lg">Youth Vote Tab<br/><span className="text-sm font-normal mt-2 block">Coming Soon</span></div>}
                        {activeTab === 'settings' && <Settings />}
                    </main>

                    {/* Bottom Tab Navigation */}
                    <nav className="bg-white border-t border-gray-200 fixed bottom-0 w-full flex justify-between px-2 pt-2 pb-6 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-20 flex-shrink-0 safe-bottom">
                        {navItems.map(item => {
                            const isActive = activeTab === item.id;
                            return (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex flex-col items-center p-2 w-1/5 rounded-xl transition-all ${isActive ? 'text-scoutGreen' : 'text-gray-400 hover:text-gray-500'}`}>
                                    <div className={`p-1.5 rounded-full mb-1 transition-colors ${isActive ? 'bg-green-50 text-scoutGreen' : 'bg-transparent'}`}>
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={isActive ? "2.5" : "2"} d={item.icon}></path>
                                        </svg>
                                    </div>
                                    <span className={`text-[10px] truncate w-full text-center tracking-wide ${isActive ? 'font-black' : 'font-medium'}`}>{item.label}</span>
                                </button>
                            )
                        })}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
